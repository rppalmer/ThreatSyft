[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "threatsyft"
version = "0.1.0"
description = "Console-first Python security sidekick with focused MCP servers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.6.17",
    # Upper bound is deliberate: mcp 2.0.0 is a major rework of the SDK. The
    # [cli] extra is intentionally absent; it pulls typer, rich, uvicorn and
    # starlette for a command-line tool these stdio servers do not use.
    "mcp>=1.28,<2",
    "dnspython>=2.8,<3",
    "httpx>=0.28,<0.29",
    "ipwhois>=1.3,<2",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "python-whois>=0.9.6,<0.10",
]

[project.scripts]
threatsyft-update = "threatsyft.update_cli:main"
threatsyft-enrichment-mcp = "threatsyft.mcp.enrichment_server:main"
threatsyft-knowledge-mcp = "threatsyft.mcp.knowledge_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
